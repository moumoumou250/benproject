name: Local engine checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/dev.py lint
      - run: uv run --frozen python scripts/dev.py test
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ben/interface/viewer/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Ben/interface/viewer/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ben/interface/tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Ben/interface/tui/go.mod
          cache-dependency-path: Ben/interface/tui/go.sum
      - run: go vet ./...
      - run: go test -race ./...
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: Ben/interface/tui/go.mod
      - run: uv build --wheel
      - run: uv venv /tmp/ben-installed
      - run: uv pip install --python /tmp/ben-installed/bin/python dist/*.whl
      - run: cd /tmp && /tmp/ben-installed/bin/ben --help
